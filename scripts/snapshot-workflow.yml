# Copy to .github/workflows/snapshot.yml to enable. Kept here because the PR bot lacks the `workflows` permission.
name: Refresh GitHub snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch snapshot
        run: node scripts/snapshot.mjs | tee snapshot.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if data changed
        run: |
          git diff --quiet data/github-snapshot.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-snapshot.json
          git commit -m "Refresh GitHub snapshot"
          git push
      # Fail after committing so the data still lands, but maintainers get notified.
      - name: Flag repos that need review
        run: "! grep '^needs review:' snapshot.log"
